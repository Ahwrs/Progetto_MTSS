name: Build Automation GitHub Actions

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v3

    - name: Setup Java 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compilazione codice
      run: mvn clean compile

    - name: Esecuzione test
      run: mvn test

    - name: Analisi statica
      run: mvn checkstyle:check

    - name: Report Coverage to Coveralls
      run: mvn coveralls:report --define repoToken=${{ secrets.GITHUB_TOKEN }}